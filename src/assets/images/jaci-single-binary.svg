<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="bGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="bGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <text x="450" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Native AOT Single Binary Compilation Pipeline</text>

  <!-- Step 1: AST require traversal -->
  <g transform="translate(30, 65)">
    <rect width="250" height="200" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <rect width="250" height="36" rx="8" fill="url(#bGrad1)"/>
    <rect y="28" width="250" height="8" fill="#1e40af"/>
    <text x="125" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1. AST Dependency Bundler</text>
    
    <g transform="translate(15, 52)" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="16" fill="#93c5fd" font-weight="600">• AstVisitor Traversal</text>
      <text x="10" y="34" fill="#94a3b8">Resolves static require() calls</text>
      <text x="0" y="60" fill="#93c5fd" font-weight="600">• Bytecode Compilation</text>
      <text x="10" y="78" fill="#94a3b8">Compiles chunks with Luau::compile</text>
      <text x="0" y="104" fill="#93c5fd" font-weight="600">• Transitive Graph Analysis</text>
      <text x="10" y="122" fill="#94a3b8">Embeds all required dependencies</text>
    </g>
  </g>

  <!-- Step 2: In-Memory Virtual Runtime -->
  <g transform="translate(325, 65)">
    <rect width="250" height="200" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect width="250" height="36" rx="8" fill="url(#bGrad2)"/>
    <rect y="28" width="250" height="8" fill="#6d28d9"/>
    <text x="125" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2. Embedded Runtime Unit</text>
    
    <g transform="translate(15, 52)" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="16" fill="#c4b5fd" font-weight="600">• Generated C++ Unit</text>
      <text x="10" y="34" fill="#94a3b8">Static bytecode chunk tables</text>
      <text x="0" y="60" fill="#c4b5fd" font-weight="600">• In-Memory Module Resolver</text>
      <text x="10" y="78" fill="#94a3b8">Virtual require navigation</text>
      <text x="0" y="104" fill="#c4b5fd" font-weight="600">• Complete Standard Library</text>
      <text x="10" y="122" fill="#94a3b8">fs, net, ffi, task, process, json</text>
    </g>
  </g>

  <!-- Step 3: Linker Pipeline -->
  <g transform="translate(620, 65)">
    <rect width="250" height="200" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <rect width="250" height="36" rx="8" fill="url(#bGrad3)"/>
    <rect y="28" width="250" height="8" fill="#047857"/>
    <text x="125" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3. Static Linker Pipeline</text>
    
    <g transform="translate(15, 52)" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="16" fill="#6ee7b7" font-weight="600">• Static Archive Linking</text>
      <text x="10" y="34" fill="#94a3b8">Luau.VM.a, CodeGen.a, etc.</text>
      <text x="0" y="60" fill="#6ee7b7" font-weight="600">• Standalone Executable</text>
      <text x="10" y="78" fill="#94a3b8">Zero external file dependencies</text>
      <text x="0" y="104" fill="#6ee7b7" font-weight="600">• Instant Native Startup</text>
      <text x="10" y="122" fill="#94a3b8">luau --build -o app main.luau</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="450" y="295" text-anchor="middle" fill="#94a3b8" font-size="12">Compile and distribute high-performance single binary executables across platforms</text>
</svg>